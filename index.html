<title>Contagem de Mercadoria · SP Grifes</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600&display=swap">
<style>
body{margin:0}img{max-width:100%}[hidden]{display:none!important}

/* Layout: faixa branca da marca no topo, formulário de contagem, depois o histórico de entradas em cartões empilhados */
:root{
  --bg:#f3f2f1; --surface:#ffffff; --line:#dedbd8; --fg:#141313; --muted:#6b6663;
  --red:#d71d1d; --red-soft:#fbe9e8; --ink:#141313; --ok:#1d7a46;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121111; --surface:#1d1b1b; --line:#343030; --fg:#f2efed; --muted:#a39d99;
  --red:#ff4a43; --red-soft:#3a1716; --ink:#f2efed; --ok:#4cc683; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121111; --surface:#1d1b1b; --line:#343030; --fg:#f2efed; --muted:#a39d99;
  --red:#ff4a43; --red-soft:#3a1716; --ink:#f2efed; --ok:#4cc683; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.45}
.brand{background:#fff;border-bottom:4px solid #d71d1d;padding:14px 16px;display:flex;justify-content:center;position:relative}
.menubtn{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:46px;height:46px;border:0;background:none;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:6px;border-radius:8px}
.menubtn span{display:block;width:26px;height:3px;background:#141313;border-radius:2px}
.menubtn:hover{background:#f3f2f1}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20}
.drawer{position:fixed;top:0;left:0;bottom:0;width:min(300px,84vw);background:var(--surface);z-index:21;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);box-shadow:4px 0 24px rgba(0,0,0,.2)}
.drawer-head{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:4px solid var(--red)}
.drawer-head b{font-family:var(--display);font-weight:800;font-size:1.3rem;letter-spacing:.06em;text-transform:uppercase}
.xbtn{background:none;border:0;font-size:1.8rem;line-height:1;color:var(--fg);padding:4px 8px}
.mitem{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:18px;font-family:var(--display);font-weight:700;font-size:1.2rem;letter-spacing:.04em;text-transform:uppercase;color:var(--fg)}
.mitem small{display:block;font-family:var(--body);font-weight:400;font-size:.85rem;text-transform:none;letter-spacing:0;color:var(--muted);margin-top:2px}
.mitem:hover{background:var(--red-soft)}
.mitem.sair{color:var(--red);margin-top:auto;border-top:1px solid var(--line)}
.filtros{display:flex;flex-direction:column;gap:14px}
#busca{text-transform:uppercase;font-family:var(--display);font-weight:700;font-size:1.15rem}
.periodos{display:flex;flex-wrap:wrap;gap:6px}
.pbtn{background:var(--surface);border:1.5px solid var(--line);color:var(--fg);padding:8px 12px;font-family:var(--display);font-weight:700;font-size:1rem}
.pbtn[aria-pressed="true"]{background:var(--red);border-color:var(--red);color:#fff}
#dataEsp{max-width:200px}
.resumo{background:var(--red-soft);border-radius:8px;padding:14px;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:10px}
.resumo .big{font-size:2.2rem}
.fhead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.fhead h2{font-family:var(--display);font-weight:800;font-size:1.4rem;text-transform:uppercase;margin:0}
.linkbtn{background:none;border:0;color:var(--red);text-decoration:underline;font-size:.92rem;padding:4px}
.brand img{height:72px;width:auto;display:block}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:20px 48px;display:flex;flex-direction:column;gap:22px}
h1{font-family:var(--display);font-weight:800;font-size:2.1rem;letter-spacing:.02em;text-transform:uppercase;margin:0;text-wrap:balance}
.sub{color:var(--muted);margin:2px 0 0;font-size:.95rem}
.label{font-family:var(--display);font-weight:600;font-size:.82rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px}
form{display:flex;flex-direction:column;gap:16px}
.field{display:flex;flex-direction:column;gap:6px}
input{font:inherit;color:var(--fg);background:var(--bg);border:1.5px solid var(--line);border-radius:8px;padding:12px;width:100%}
input:focus{outline:none;border-color:var(--red);box-shadow:0 0 0 3px var(--red-soft)}
#produto{text-transform:uppercase;font-family:var(--display);font-weight:700;font-size:1.3rem;letter-spacing:.03em}
#grades{font-family:var(--display);font-weight:700;font-size:1.5rem;max-width:180px}
.sizes{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.size{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.size span{font-family:var(--display);font-weight:800;font-size:1.15rem}
.size input{text-align:center;font-family:var(--display);font-weight:700;font-size:1.35rem;padding:10px 4px}
input[type=number]{-moz-appearance:textfield}
input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.preview{border-top:1px dashed var(--line);padding-top:14px;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.big{font-family:var(--display);font-weight:800;font-size:2.6rem;line-height:1;color:var(--red);font-variant-numeric:tabular-nums}
.big small{font-size:1rem;color:var(--muted);font-weight:600;margin-left:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:var(--display);font-weight:700;font-size:1rem;border:1.5px solid var(--line);border-radius:6px;padding:3px 9px;font-variant-numeric:tabular-nums;background:var(--surface)}
.chip b{color:var(--red);margin-right:4px}
button{font:inherit;cursor:pointer;border-radius:8px}
.primary{background:var(--red);color:#fff;border:0;padding:14px 18px;font-family:var(--display);font-weight:800;font-size:1.15rem;letter-spacing:.08em;text-transform:uppercase}
.primary:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
.msg{min-height:1.2em;font-size:.92rem;color:var(--muted)}
.msg.err{color:var(--red)} .msg.ok{color:var(--ok)}
.listhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.listhead h2{font-family:var(--display);font-weight:800;font-size:1.5rem;text-transform:uppercase;letter-spacing:.03em;margin:0}
.tot{font-family:var(--display);font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.list{display:flex;flex-direction:column;gap:10px}
.entry{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--red);border-radius:8px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.erow{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}
.ename{font-family:var(--display);font-weight:800;font-size:1.3rem;letter-spacing:.02em;min-width:0;overflow-wrap:anywhere}
.ewhen{font-size:.88rem;color:var(--muted);font-variant-numeric:tabular-nums}
.etotal{font-family:var(--display);font-weight:800;font-size:1.7rem;color:var(--red);line-height:1;font-variant-numeric:tabular-nums;text-align:right}
.etotal small{display:block;font-size:.78rem;color:var(--muted);letter-spacing:.08em;font-weight:600}
.emeta{font-size:.92rem;color:var(--muted)}
.emeta strong{color:var(--fg);font-weight:600}
.del{background:none;border:0;color:var(--muted);font-size:.85rem;padding:4px 0;text-decoration:underline}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.9rem}
.confirm .yes{background:var(--red);color:#fff;border:0;padding:6px 12px}
.confirm .no{background:none;border:1px solid var(--line);color:var(--fg);padding:6px 12px}
.empty{color:var(--muted);text-align:center;padding:28px 12px;border:1.5px dashed var(--line);border-radius:10px}
.status{font-size:.82rem;color:var(--muted);text-align:center}
@media (max-width:420px){.size span{font-size:1rem}.size input{font-size:1.15rem}.big{font-size:2.2rem}}
@media (prefers-reduced-motion:no-preference){.entry.new{animation:pop .5s ease}@keyframes pop{from{background:var(--red-soft)}}}

.login{max-width:380px;margin:0 auto;padding-inline:16px;padding-block:40px;display:flex;flex-direction:column;gap:16px;text-align:center}
.login h1{font-size:1.8rem}
#pin{text-align:center;font-family:var(--display);font-weight:800;font-size:1.8rem;letter-spacing:.3em}
.pinmsg{min-height:1.2em;color:var(--red);font-size:.95rem}

<div class="scrim" id="scrim" hidden></div>
<nav class="drawer" id="drawer" hidden aria-label="Menu">
  <div class="drawer-head"><b>Menu</b><button class="xbtn" id="menuX" type="button" aria-label="Fechar menu">&times;</button></div>
  <button class="mitem" id="mLancar" type="button">Lançar entrada<small>Registrar grades que chegaram</small></button>
  <button class="mitem" id="mBuscar" type="button">Buscar e filtrar<small>Procurar produto e ver por período</small></button>
  <button class="mitem sair" id="mSair" type="button">Sair<small>Pedir a senha de novo neste aparelho</small></button>
</nav>
<section class="login" id="login">
  <h1>Contagem de Mercadoria</h1>
  <form id="loginForm" style="display:flex;flex-direction:column;gap:12px">
    <label class="label" for="pin">Senha da equipe</label>
    <input id="pin" type="password" inputmode="numeric" autocomplete="current-password">
    <button class="primary" id="pinBtn" type="submit">Entrar</button>
    <div class="pinmsg" id="pinMsg" role="status"></div>
  </form>
</section>
<main class="wrap" id="app" hidden>
  <div class="topbar"><div>
    <h1>Contagem de Mercadoria</h1>
    <p class="sub">Entrada de grades no CD. O que for lançado aqui aparece na hora para toda a equipe.</p>
  </div></div>

  <section class="card">
    <form id="form" autocomplete="off">
      <div class="field">
        <label class="label" for="produto">Nome do produto</label>
        <input id="produto" type="text" placeholder="EX: CAMISETA DIESEL" maxlength="80">
      </div>
      <div class="field">
        <label class="label" for="grades">Quantidade de grades</label>
        <input id="grades" type="number" inputmode="numeric" min="0" step="1" placeholder="0">
      </div>
      <div class="field">
        <span class="label">Formação da grade (peças por grade)</span>
        <div class="sizes" id="sizes"></div>
      </div>
      <div class="preview">
        <div>
          <div class="label">Total de peças</div>
          <div class="big" id="pvTotal">0<small>peças</small></div>
        </div>
        <div class="chips" id="pvSizes"></div>
      </div>
      <button class="primary" id="save" type="submit">Lançar entrada</button>
      <div class="msg" id="msg" role="status"></div>
    </form>
  </section>

  <section class="card" id="filtroBox" hidden>
    <div class="filtros">
      <div class="fhead"><h2>Buscar e filtrar</h2><button class="linkbtn" id="limpar" type="button">Limpar filtro</button></div>
      <div class="field">
        <label class="label" for="busca">Produto</label>
        <input id="busca" type="search" placeholder="DIGITE PARTE DO NOME" autocomplete="off">
      </div>
      <div class="field">
        <span class="label">Período</span>
        <div class="periodos" id="periodos">
          <button class="pbtn" type="button" data-p="todos" aria-pressed="true">Tudo</button>
          <button class="pbtn" type="button" data-p="hoje" aria-pressed="false">Hoje</button>
          <button class="pbtn" type="button" data-p="ontem" aria-pressed="false">Ontem</button>
          <button class="pbtn" type="button" data-p="7d" aria-pressed="false">7 dias</button>
          <button class="pbtn" type="button" data-p="mes" aria-pressed="false">Este mês</button>
          <button class="pbtn" type="button" data-p="data" aria-pressed="false">Escolher dia</button>
        </div>
        <input id="dataEsp" type="date" hidden>
      </div>
      <div class="resumo">
        <div><div class="label" id="rLabel">Resultado</div><div class="big" id="rTotal">0<small>peças</small></div></div>
        <div class="chips" id="rSizes"></div>
      </div>
    </div>
  </section>

  <section id="listaSec">
    <div class="listhead">
      <h2>Entradas de mercadoria</h2>
      <span class="tot" id="hoje"></span>
    </div>
    <div class="list" id="list" style="margin-top:12px">
      <div class="empty" id="empty">Carregando entradas…</div>
    </div>
    <p class="status" id="status"></p>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
(function(){
  var SUPA_URL="https://hkhbyeygzfdhwxsdgaxl.supabase.co", SUPA_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhraGJ5ZXlnemZkaHd4c2RnYXhsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE2MDAwODQsImV4cCI6MjEwNzE3NjA4NH0.klkIwujZEA54ZggiUJpQkWwjDYs1VJ80sZ7M_mUlVUY";
  var SIZES=["P","M","G","GG","XG"];
  var $=function(id){return document.getElementById(id)};
  var sb=window.supabase.createClient(SUPA_URL,SUPA_KEY);
  var PIN=null, entries=[], pendingDelete=null, lastAdded=null, canal=null;

  function lsGet(k){try{return localStorage.getItem(k)}catch(_){return null}}
  function lsSet(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(_){}}

  var sizesBox=$("sizes");
  SIZES.forEach(function(s){
    var d=document.createElement("label");d.className="size";d.htmlFor="t_"+s;
    d.innerHTML='<span>'+s+'</span><input id="t_'+s+'" type="number" inputmode="numeric" min="0" step="1" placeholder="0">';
    sizesBox.appendChild(d);
  });
  var produto=$("produto"),grades=$("grades"),msg=$("msg"),saveBtn=$("save");

  function num(v){var n=parseInt(v,10);return isFinite(n)&&n>0?n:0}
  function fmt(n){return Number(n||0).toLocaleString("pt-BR")}
  function calc(){
    var g=num(grades.value),form={},por={},pg=0;
    SIZES.forEach(function(s){var q=num($("t_"+s).value);if(q>0){form[s]=q;por[s]=q*g;pg+=q}});
    return {grades:g,formacao:form,porTamanho:por,pecasPorGrade:pg,total:pg*g};
  }
  function chipsHTML(por){
    return SIZES.filter(function(s){return por&&por[s]>0}).map(function(s){
      return '<span class="chip"><b>'+s+'</b>'+fmt(por[s])+'</span>'}).join("");
  }
  function preview(){
    var c=calc();
    $("pvTotal").innerHTML=fmt(c.total)+'<small>peças</small>';
    $("pvSizes").innerHTML=c.grades?chipsHTML(c.porTamanho):"";
  }
  produto.addEventListener("input",function(){
    var p=produto.selectionStart,e=produto.selectionEnd,u=produto.value.toUpperCase();
    if(u!==produto.value){produto.value=u;try{produto.setSelectionRange(p,e)}catch(_){}}
  });
  document.querySelectorAll("#form input[type=number]").forEach(function(i){i.addEventListener("input",preview)});
  function say(t,cls){msg.textContent=t;msg.className="msg"+(cls?" "+cls:"")}
  function senhaErrada(err){return err&&String(err.message||"").indexOf("senha_invalida")>=0}
  function sair(t){PIN=null;lsSet("cd_pin",null);$("app").hidden=true;$("menuBtn").hidden=true;$("filtroBox").hidden=true;$("login").hidden=false;$("pinMsg").textContent=t||"";$("pin").value="";$("pin").focus()}

  // ---------- senha da equipe ----------
  $("loginForm").addEventListener("submit",function(ev){
    ev.preventDefault();
    var p=$("pin").value.trim(); if(!p)return;
    $("pinBtn").disabled=true;$("pinMsg").textContent="Conferindo…";
    sb.rpc("checa_pin",{p:p}).then(function(r){
      $("pinBtn").disabled=false;
      if(r.error){$("pinMsg").textContent="Sem conexão. Confira a internet e tente de novo.";return}
      if(r.data===true){PIN=p;lsSet("cd_pin",p);entrar()}
      else $("pinMsg").textContent="Senha incorreta.";
    });
  });
  var filtro={q:"",p:"todos",dia:""};
  function abrirMenu(){$("drawer").hidden=false;$("scrim").hidden=false;$("menuX").focus()}
  function fecharMenu(){$("drawer").hidden=true;$("scrim").hidden=true}
  $("menuBtn").addEventListener("click",abrirMenu);
  $("menuX").addEventListener("click",fecharMenu);
  $("scrim").addEventListener("click",fecharMenu);
  document.addEventListener("keydown",function(e){if(e.key==="Escape")fecharMenu()});
  $("mLancar").addEventListener("click",function(){fecharMenu();$("form").scrollIntoView({behavior:"smooth"});produto.focus({preventScroll:true})});
  $("mBuscar").addEventListener("click",function(){fecharMenu();$("filtroBox").hidden=false;render();$("filtroBox").scrollIntoView({behavior:"smooth"});$("busca").focus({preventScroll:true})});
  $("mSair").addEventListener("click",function(){fecharMenu();sair("")});
  $("busca").addEventListener("input",function(){
    var b=$("busca"),p=b.selectionStart,u=b.value.toUpperCase();
    if(u!==b.value){b.value=u;try{b.setSelectionRange(p,p)}catch(_){}}
    filtro.q=u.trim();render();
  });
  $("periodos").addEventListener("click",function(e){
    var t=e.target.closest(".pbtn");if(!t)return;
    filtro.p=t.dataset.p;
    document.querySelectorAll(".pbtn").forEach(function(b){b.setAttribute("aria-pressed",b===t?"true":"false")});
    $("dataEsp").hidden=filtro.p!=="data";
    if(filtro.p==="data"&&!$("dataEsp").value){var d=new Date();$("dataEsp").value=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
    filtro.dia=$("dataEsp").value;render();
  });
  $("dataEsp").addEventListener("change",function(){filtro.dia=$("dataEsp").value;render()});
  $("limpar").addEventListener("click",function(){
    filtro={q:"",p:"todos",dia:""};$("busca").value="";$("dataEsp").hidden=true;
    document.querySelectorAll(".pbtn").forEach(function(b){b.setAttribute("aria-pressed",b.dataset.p==="todos"?"true":"false")});
    render();
  });
  function filtrado(){
    var agora=new Date(),ini=null,fim=null,d0=new Date(agora.getFullYear(),agora.getMonth(),agora.getDate());
    if(filtro.p==="hoje"){ini=d0}
    else if(filtro.p==="ontem"){ini=new Date(d0);ini.setDate(ini.getDate()-1);fim=d0}
    else if(filtro.p==="7d"){ini=new Date(d0);ini.setDate(ini.getDate()-6)}
    else if(filtro.p==="mes"){ini=new Date(agora.getFullYear(),agora.getMonth(),1)}
    else if(filtro.p==="data"&&filtro.dia){var a=filtro.dia.split("-");ini=new Date(+a[0],a[1]-1,+a[2]);fim=new Date(ini);fim.setDate(fim.getDate()+1)}
    return entries.filter(function(e){
      var t=new Date(e.criado_em);
      if(ini&&t<ini)return false;
      if(fim&&t>=fim)return false;
      if(filtro.q&&String(e.produto||"").indexOf(filtro.q)<0)return false;
      return true;
    });
  }
  function filtroAtivo(){return !$("filtroBox").hidden&&(filtro.q||filtro.p!=="todos")}

  function entrar(){
    $("login").hidden=true;$("app").hidden=false;$("menuBtn").hidden=false;preview();carregar();ligarAoVivo();
  }

  // ---------- dados ----------
  var carregando=false, denovo=false;
  function carregar(){
    if(!PIN)return;
    if(carregando){denovo=true;return}
    carregando=true;
    sb.rpc("listar_entradas",{p:PIN}).then(function(r){
      carregando=false;
      if(r.error){
        if(senhaErrada(r.error)){sair("A senha da equipe mudou. Digite a nova senha.");return}
        $("status").textContent="Sem conexão. Tentando de novo…";
      } else {
        entries=r.data||[];render();
        $("status").textContent="Ao vivo · atualizado às "+new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit",second:"2-digit"});
      }
      if(denovo){denovo=false;carregar()}
    });
  }
  function avisarTodos(){ if(canal) canal.send({type:"broadcast",event:"mudou",payload:{t:Date.now()}}) }
  function ligarAoVivo(){
    if(canal)return;
    canal=sb.channel("contagem-cd",{config:{broadcast:{self:false}}});
    canal.on("broadcast",{event:"mudou"},function(){carregar()}).subscribe();
    setInterval(function(){if(!document.hidden)carregar()},10000);
    document.addEventListener("visibilitychange",function(){if(!document.hidden)carregar()});
  }

  $("form").addEventListener("submit",function(ev){
    ev.preventDefault();
    var nome=produto.value.trim().toUpperCase(),c=calc();
    if(!nome){say("Digite o nome do produto.","err");produto.focus();return}
    if(!c.grades){say("Informe a quantidade de grades.","err");grades.focus();return}
    if(!c.pecasPorGrade){say("Preencha a formação da grade em pelo menos um tamanho.","err");$("t_P").focus();return}
    saveBtn.disabled=true;say("Salvando…");
    sb.rpc("lancar_entrada",{p:PIN,produto:nome,grades:c.grades,formacao:c.formacao}).then(function(r){
      saveBtn.disabled=false;
      if(r.error){
        if(senhaErrada(r.error)){sair("A senha da equipe mudou. Digite a nova senha.");return}
        say("Não foi possível salvar. Confira a internet e tente de novo.","err");return;
      }
      lastAdded=r.data&&r.data.id;
      say("Entrada lançada: "+nome+" — "+fmt(c.total)+" peças.","ok");
      produto.value="";grades.value="";SIZES.forEach(function(s){$("t_"+s).value=""});
      preview();produto.focus();carregar();avisarTodos();
    });
  });

  function whenText(iso){
    var d=new Date(iso);if(isNaN(d))return "";
    return d.toLocaleDateString("pt-BR",{weekday:"short",day:"2-digit",month:"2-digit",year:"numeric"})+" às "+
      d.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
  }
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}

  function render(){
    var list=$("list"),lista=filtrado(),ativo=filtroAtivo();
    var rt=0,rs={};lista.forEach(function(d){rt+=d.total||0;SIZES.forEach(function(s){var v=d.por_tamanho&&d.por_tamanho[s];if(v)rs[s]=(rs[s]||0)+v})});
    $("rTotal").innerHTML=fmt(rt)+"<small>peças</small>";
    $("rSizes").innerHTML=chipsHTML(rs);
    $("rLabel").textContent=lista.length+(lista.length===1?" entrada encontrada":" entradas encontradas");
    if(entries.length&&!lista.length){
      list.innerHTML='<div class="empty">Nenhuma entrada encontrada com esse filtro. Toque em <strong>Limpar filtro</strong> para ver tudo.</div>';
      $("hoje").textContent="";return;
    }
    if(!entries.length){
      list.innerHTML='<div class="empty">Nenhuma entrada ainda. Preencha o produto, as grades e a formação acima e toque em <strong>Lançar entrada</strong>.</div>';
      $("hoje").textContent="";return;
    }
    var today=new Date().toDateString(),tHoje=0,nHoje=0;
    entries.forEach(function(d){if(new Date(d.criado_em).toDateString()===today){tHoje+=d.total||0;nHoje++}});
    list.innerHTML=lista.map(function(d){
      var form=SIZES.filter(function(s){return d.formacao&&d.formacao[s]>0}).map(function(s){return d.formacao[s]+s}).join(" · ");
      var del=pendingDelete===d.id
        ? '<div class="confirm">Apagar esta entrada? <button class="yes" data-yes="'+d.id+'">Apagar</button><button class="no" data-no="1">Cancelar</button></div>'
        : '<button class="del" data-del="'+d.id+'">Apagar entrada</button>';
      return '<article class="entry'+(d.id===lastAdded?' new':'')+'">'+
        '<div class="erow"><div style="min-width:0"><div class="ename">'+esc(d.produto||"")+'</div>'+
        '<div class="ewhen">'+whenText(d.criado_em)+'</div></div>'+
        '<div class="etotal">'+fmt(d.total)+'<small>PEÇAS</small></div></div>'+
        '<div class="emeta"><strong>'+fmt(d.grades)+' grades</strong> de '+fmt(d.pecas_por_grade)+' peças ('+form+')</div>'+
        '<div class="chips">'+chipsHTML(d.por_tamanho)+'</div>'+del+'</article>';
    }).join("");
    $("hoje").textContent=ativo?("Filtro: "+fmt(rt)+" peças"):nHoje?("Hoje: "+fmt(tHoje)+" peças em "+nHoje+(nHoje>1?" entradas":" entrada")):"";
  }

  $("list").addEventListener("click",function(ev){
    var t=ev.target;
    if(t.dataset.del){pendingDelete=t.dataset.del;render()}
    else if(t.dataset.no){pendingDelete=null;render()}
    else if(t.dataset.yes){
      var id=t.dataset.yes;t.disabled=true;
      sb.rpc("apagar_entrada",{p:PIN,entrada:id}).then(function(r){
        pendingDelete=null;
        if(r.error){say("Não foi possível apagar a entrada.","err");render();return}
        entries=entries.filter(function(e){return e.id!==id});render();avisarTodos();
      });
    }
  });

  // ---------- início ----------
  var salvo=lsGet("cd_pin");
  if(salvo){
    sb.rpc("checa_pin",{p:salvo}).then(function(r){
      if(!r.error&&r.data===true){PIN=salvo;entrar()} else sair("");
    });
  } else sair("");
})();
</script>
</body></html>
