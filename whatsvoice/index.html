<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Whats Voice</title>
<style>
  :root{--top:#008069;--bg:#efeae2;--in:#ffffff;--out:#d9fdd3;--ink:#111b21;--soft:#667781;--gold:#C9A24A;--line:#d1d7db}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column}
  .hide{display:none!important}
  header{background:var(--top);color:#fff;display:flex;align-items:center;gap:12px;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px}
  header img{width:40px;height:40px;border-radius:50%;background:#fff}
  header .t{display:flex;flex-direction:column;min-width:0}
  header .n{font-size:18px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  header .s{font-size:12px;opacity:.85}
  header .cnt{margin-left:auto;font-size:13px;background:rgba(255,255,255,.18);padding:4px 10px;border-radius:12px;white-space:nowrap}
  #chat{flex:1;overflow:auto;padding:14px 12px;display:flex;flex-direction:column;gap:6px;background:var(--bg)}
  .m{max-width:82%;padding:8px 10px;border-radius:10px;font-size:17px;line-height:1.35;box-shadow:0 1px .5px rgba(11,20,26,.13);white-space:pre-wrap;word-wrap:break-word}
  .m.in{align-self:flex-start;background:var(--in);border-top-left-radius:2px}
  .m.out{align-self:flex-end;background:var(--out);border-top-right-radius:2px;display:flex;gap:10px;justify-content:space-between;align-items:flex-start}
  .m.out b{cursor:pointer;color:var(--soft);padding:0 2px}
  .dia{align-self:center;background:#fff;color:var(--soft);font-size:12px;padding:4px 10px;border-radius:8px;box-shadow:0 1px .5px rgba(11,20,26,.13)}
  .vazio{margin:auto;text-align:center;color:var(--soft);font-size:18px;padding:30px}
  footer{background:#f0f2f5;border-top:1px solid var(--line);padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px}
  #aviso{font-size:13px;color:var(--soft);text-align:center;min-height:16px}
  #campo{font:inherit;font-size:19px;padding:10px 14px;border-radius:22px;border:0;background:#fff;color:var(--ink);width:100%;resize:none;outline:none}
  .btns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  button{font:inherit;font-size:16px;font-weight:700;padding:14px 8px;border-radius:14px;border:0;cursor:pointer;min-height:52px}
  .b-resp{background:var(--top);color:#fff;grid-column:1/-1;font-size:19px;min-height:58px}
  .b-ign{background:#fff;color:#a33;border:1px solid var(--line)}
  .b-pul{background:#fff;color:var(--ink);border:1px solid var(--line)}
  .b-ouv{background:#fff;color:var(--top);border:1px solid var(--line)}
  .login{margin:auto;display:flex;flex-direction:column;gap:12px;align-items:center;padding:24px;text-align:center}
  .login img{width:96px;border-radius:24px}
  input{font:inherit;font-size:20px;padding:14px;border-radius:12px;border:1px solid var(--line);width:100%;max-width:300px;background:#fff;color:var(--ink);text-align:center}
  .err{color:#a33;font-size:14px}
</style>
</head>
<body>
<div id="login" class="login">
  <img src="logo.png" alt="">
  <h2 style="margin:0">Whats Voice</h2>
  <input id="senha" type="password" placeholder="Senha" autocomplete="current-password">
  <button class="b-resp" id="entrar" style="max-width:300px;width:100%">Entrar</button>
  <div id="lerr" class="err"></div>
</div>

<div id="app" class="hide" style="flex:1;flex-direction:column;min-height:0">
  <header>
    <img src="logo.png" alt="">
    <div class="t"><div class="n" id="who">Whats Voice</div><div class="s" id="when"></div></div>
    <div class="cnt" id="cnt"></div>
  </header>
  <div id="chat"></div>
  <footer id="rodape" class="hide">
    <div id="aviso">Fale pelo microfone do teclado. Parou 5 segundos = vira um balão.</div>
    <textarea id="campo" rows="2" placeholder="Mensagem"></textarea>
    <div class="btns">
      <button class="b-resp hide" id="bresp">Responder</button>
      <button class="b-ign" id="bign">Ignorar</button>
      <button class="b-pul" id="bpul">Pular</button>
      <button class="b-ouv" id="bouv">Ouvir</button>
    </div>
  </footer>
</div>

<script>
var URL_SB = "https://cuiqmczhtcrrxafmzmhh.supabase.co";
var KEY = "sb_publishable_2A36EPYGbgAXMOPj0Up6yg_IxSsYmak";
var senha = "", atual = null, baloes = [], silencio = null;
var SEP = "\n§§\n";

function $(id){return document.getElementById(id)}
function save(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function load(k){try{return localStorage.getItem(k)||""}catch(e){return ""}}
function esc(s){return String(s).replace(/[&<>]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c]})}

async function rpc(fn,args){
  var r = await fetch(URL_SB+"/rest/v1/rpc/"+fn,{method:"POST",
    headers:{"apikey":KEY,"Authorization":"Bearer "+KEY,"Content-Type":"application/json"},
    body:JSON.stringify(args)});
  if(!r.ok) throw new Error(await r.text());
  var t = await r.text();
  return t ? JSON.parse(t) : null;
}

function falar(msg){
  try{
    speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(msg);
    u.lang="pt-BR"; u.rate=1.25;
    var vs = speechSynthesis.getVoices().filter(function(v){return /pt[-_]BR/i.test(v.lang)});
    var m = vs.filter(function(v){return /(felipe|ricardo|daniel|google portugu|male|masc)/i.test(v.name)})[0] || vs[0];
    if(m) u.voice = m;
    speechSynthesis.speak(u);
  }catch(e){}
}

function desenhar(){
  var ms = (atual && atual.mensagens) || [];
  var h = '<div class="dia">'+esc((atual&&atual.data_ultima)||"")+'</div>';
  h += ms.map(function(m){return '<div class="m '+(m.eu?'out':'in')+'">'+esc(m.t)+'</div>'}).join("");
  h += baloes.map(function(t,i){return '<div class="m out"><span>'+esc(t)+'</span><b data-i="'+i+'">×</b></div>'}).join("");
  var c = $("chat"); c.innerHTML = h;
  Array.prototype.forEach.call(c.querySelectorAll("b"),function(b){b.onclick=function(){baloes.splice(+b.getAttribute("data-i"),1);desenhar();botao();}});
  c.scrollTop = c.scrollHeight;
}
function botao(){ var tem = baloes.length || ($("campo").value.trim()); $("bresp").classList.toggle("hide",!tem); }

function fecharBalao(){
  var v = $("campo").value.trim();
  if(!v) return;
  baloes.push(v); $("campo").value=""; desenhar(); botao();
  $("aviso").textContent = "Balão "+baloes.length+" guardado. Fale outro ou toque em Responder.";
}
function aoMudar(){
  if(silencio) clearTimeout(silencio);
  botao();
  if($("campo").value.trim()) silencio = setTimeout(fecharBalao,5000);
}

async function proxima(){
  baloes=[]; if(silencio){clearTimeout(silencio);silencio=null;}
  $("campo").value=""; $("aviso").textContent="Buscando a próxima conversa...";
  try{
    var d = await rpc("wv_proxima",{p_senha:senha});
    atual = d;
    $("cnt").textContent = d.restantes ? d.restantes+" na fila" : "";
    if(d.fim){
      atual=null; $("who").textContent="Whats Voice"; $("when").textContent="";
      $("chat").innerHTML='<div class="vazio">Acabaram as conversas da fila por enquanto.<br>Quando eu trouxer mais, é só abrir de novo.</div>';
      $("rodape").classList.add("hide"); falar("Acabaram as conversas da fila."); return;
    }
    $("who").textContent = d.contato; $("when").textContent = "toque em Ouvir para escutar";
    $("rodape").classList.remove("hide");
    $("aviso").textContent = "Fale pelo microfone do teclado. Parou 5 segundos = vira um balão.";
    desenhar(); botao(); lerAtual();
  }catch(e){ $("chat").innerHTML='<div class="vazio err">Não consegui buscar: '+esc(e.message)+'</div>'; }
}
function lerAtual(){
  if(!atual) return;
  var partes = (atual.mensagens||[]).filter(function(m){return !m.eu}).slice(-4).map(function(m){return m.t});
  falar(atual.contato+" disse: "+partes.join(". ")+".");
}

async function acao(fn, fala){
  if(!atual) return;
  try{ await rpc(fn,{p_senha:senha,p_id:atual.id}); if(fala) falar(fala); proxima(); }
  catch(e){ $("aviso").textContent="Erro: "+e.message; }
}
async function responder(){
  if(silencio){clearTimeout(silencio);silencio=null;}
  fecharBalao();
  if(!baloes.length||!atual) return;
  try{ await rpc("wv_responder",{p_senha:senha,p_id:atual.id,p_texto:baloes.join(SEP)}); falar("Enviando. Próxima."); proxima(); }
  catch(e){ $("aviso").textContent="Erro ao salvar: "+e.message; }
}

async function entrar(){
  senha = $("senha").value.trim() || load("wv_senha");
  try{
    await rpc("wv_proxima",{p_senha:senha});
    save("wv_senha",senha);
    $("login").classList.add("hide");
    $("app").classList.remove("hide"); $("app").style.display="flex";
    proxima();
  }catch(e){ $("lerr").textContent="Senha não confere."; }
}
$("entrar").onclick = entrar;
$("senha").addEventListener("keydown",function(e){if(e.key==="Enter")entrar()});
$("campo").oninput = aoMudar;
$("bresp").onclick = responder;
$("bouv").onclick = lerAtual;
$("bign").onclick = function(){ acao("wv_pular","Ignorada."); };
$("bpul").onclick = function(){ acao("wv_nao_lida","Deixei para você resolver depois."); };
if(load("wv_senha")){ $("senha").value=load("wv_senha"); entrar(); }
</script>
</body>
</html>
